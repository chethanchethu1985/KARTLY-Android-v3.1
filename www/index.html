// Seed the default inventory with the master catalog once. Quantities remain blank until the user records stock.
try{if(!localStorage.getItem('gt_master_seed_v1')){S.items=S.items||[];const known=new Set(S.items.map(i=>normName(i.n)));let seeded=0;MASTER.forEach(m=>{if(!known.has(normName(m.e))){S.items.push({id:Math.random().toString(36).slice(2,9),n:m.e,k:m.k,c:m.c,qty:'',min:'',u:m.u,exp:'',b:'',lp:''});known.add(normName(m.e));seeded++}});localStorage.setItem('gt_master_seed_v1','1');if(seeded||S.items.length) localStorage.setItem('gt',JSON.stringify(S));}}catch(e){}
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
function medQty(m, at=today()){
  const base=Number.isFinite(+m.baseQty)?Math.max(0,+m.baseQty):Math.max(0,+m.qty||0);
  const start=m.baseDate||m.rd||at, elapsed=Math.max(0,Math.floor((new Date(at+'T00:00:00')-new Date(start+'T00:00:00'))/864e5));
  const rate=Math.max(0,+m.dpd||0);return Math.max(0,+(base-elapsed*rate).toFixed(2));
}
function autoReduce(){let changed=false;const t=today();S.meds.forEach(m=>{if(m.baseQty===undefined||m.baseDate===undefined){m.baseQty=Math.max(0,+m.qty||0);m.baseDate=m.rd||t;changed=true}});if(changed)save()}

async function toKn(en){

  try{const s=window.claude&&await claude.use('sample');if(!s)return '';

}
function addStock(name,qty,unit,cat,brand,kn){
  let it=S.items.find(i=>normName(i.n)===normName(name));
  if(it){it.qty=(+it.qty||0)+qty;if(qty>0)it.lp=today();if(brand)it.b=brand}else{
    const m=MK[normName(name)];
    it={id:uid(),n:name,k:m?m.k:(kn||''),c:cat||(m?m.c:'Pantry'),qty,min:1,u:unit||(m?m.u:'pcs'),exp:'',b:brand||'',lp:qty>0?today():''};S.items.push(it);
    if(!it.k)toKn(name).then(k=>{it.k=k;save();render()});
  }
}

function downloadBuyPdf(){
 const rows=S.items.filter(i=>((isLow(i)&&!i.ignorePurchase)||i.buyFlag)&&!i.shoppingChecked);
 const lines=['GROCERY TRACKER - TO-BUY LIST','Generated: '+today(),'','Item | Qty | Unit | Brand'];
 rows.forEach(i=>lines.push(`${i.n} | ${i.buyQty??(need(i)||1)} | ${i.buyUnit||i.u||'packs'} | ${i.buyBrand??i.b??''}`));
 if(rows.length===0)lines.push('No pending items.');
 // Build a small, valid one-page/multi-page PDF using built-in Helvetica; non-ASCII glyphs are replaced for compatibility.
 const safe=lines.map(x=>String(x).replace(/[^\x20-\x7E]/g,'?'));
 const chunks=[];for(let i=0;i<safe.length;i+=42)chunks.push(safe.slice(i,i+42));
 const objs=[];let kids=[];const add=o=>{objs.push(o);return objs.length};
 const fontId=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');
 const pagesId=add('');
 chunks.forEach((chunk,idx)=>{let content='BT /F1 10 Tf 48 790 Td 14 TL ';chunk.forEach((line,j)=>{const clean=line.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');content+=(j?'T* ':'')+'('+clean+') Tj ';});content+='ET';const streamId=add(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);const pageId=add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 ${fontId} 0 R >> >> /Contents ${streamId} 0 R >>`);kids.push(pageId+' 0 R')});
 objs[pagesId-1]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${kids.length} >>`;
 const catalogId=add(`<< /Type /Catalog /Pages ${pagesId} 0 R >>`);
 let pdf='%PDF-1.4\n',offsets=[0];objs.forEach((o,i)=>{offsets.push(pdf.length);pdf+=`${i+1} 0 obj\n${o}\nendobj\n`});const xref=pdf.length;pdf+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;for(let i=1;i<offsets.length;i++)pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';pdf+=`trailer\n<< /Size ${objs.length+1} /Root ${catalogId} 0 R >>\nstartxref\n${xref}\n%%EOF`;
 saveFile('grocery-to-buy-list.pdf',new Blob([pdf],{type:'application/pdf'}),'application/pdf');msg='PDF to-buy list prepared.';
}
async function readExcelRows(file){
 if(!window.XLSX) throw new Error('Excel reader library did not load. Check your internet connection, reopen the app, or use a CSV file.');
 const data=await file.arrayBuffer(), wb=XLSX.read(data,{type:'array',cellDates:false});
 const ws=wb.Sheets[wb.SheetNames[0]];
 return XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false}).filter(r=>r.some(v=>String(v).trim()!==''));
}

function normalizeImportDate(v){
 const x=String(v??'').trim();if(!x)return '';

document.addEventListener('input',e=>{const t=e.target;if(!t.dataset||(t.dataset.f!=='gotQty'&&t.dataset.f!=='buyQty'))return;const row=t.closest('.prow');if(!row)return;
 const pl=+row.querySelector('[data-f=buyQty]').value||0,g=+row.querySelector('[data-f=gotQty]').value||0,r=Math.max(0,pl-g),u=row.querySelector('[data-f=buyUnit]');
 row.querySelector('.pend').innerHTML=r>0?'Pending after this purchase: <b>'+r+' '+(u?u.value:'')+'</b>':'Full quantity'});

function backupNote(){if(tab!=='inv')return;const has=S.items.some(i=>i.qty!==''&&i.qty!=null)||S.meds.length||(S.stat||[]).length||(S.purchases||[]).length;if(!has)return;const d=S.lastBackup?Math.floor((Date.now()-new Date(S.lastBackup))/864e5):999;if(d<7)return;const a=document.querySelector('#app');if(a)a.insertAdjacentHTML('afterbegin','<div class="card note"><span>'+(S.lastBackup?'Last backup was '+d+' days ago.':'Your data has not been backed up yet.')+'</span><button class="pri" data-a="xbackup">Back up now</button></div>')}
const NAVI={inv:"<svg viewBox='0 0 24 24'><circle cx='12' cy='12' r='9'/><path d='M12 8v8M8 12h8'/></svg>",buy:"<svg viewBox='0 0 24 24'><circle cx='9' cy='20' r='1.5'/><circle cx='18' cy='20' r='1.5'/><path d='M3 4h2.5l2.2 11h10.3l2-8H6.3'/></svg>",avail:"<svg viewBox='0 0 24 24'><path d='M3.5 8L12 3.5 20.5 8v8L12 20.5 3.5 16z'/><path d='M3.5 8L12 12.5 20.5 8M12 12.5v8'/></svg>",med:"<svg viewBox='0 0 24 24'><path d='M10 4h4v6h6v4h-6v6h-4v-6H4v-4h6z'/></svg>",more:"<svg viewBox='0 0 24 24'><circle cx='5' cy='12' r='1.5'/><circle cx='12' cy='12' r='1.5'/><circle cx='19' cy='12' r='1.5'/></svg>"};
const SAVEI="<svg viewBox='0 0 24 24' width='16' height='16' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M5 4h11l3 3v13H5z'/><path d='M8 4v5h7V4M8 20v-6h8v6'/></svg>";
function lastBackupShort(){if(!S.lastBackup)return 'not saved yet';const d=Math.floor((Date.now()-new Date(S.lastBackup))/864e5);return d>0?'saved '+d+' days ago':'saved today'}
function pageHead(){const app=document.getElementById('app');if(!app)return;const title=Object.fromEntries(TABS)[tab]||'';
 const stock=S.items.filter(i=>i.qty!==''&&i.qty!=null&&+i.qty>0).length+S.meds.filter(m=>medQty(m)>0).length+(S.stat||[]).filter(x=>+x.qty>0).length;
 const cnt=({inv:S.items.length+' items',buy:buyList().length+' to buy',avail:stock+' in stock'})[tab]||'';const sv=(tab=='avail'||tab=='buy');
 app.insertAdjacentHTML('afterbegin','<div class="ph"><div><h2>'+title+'</h2><div class="sub">'+(sv?cnt+' | '+lastBackupShort():cnt)+'</div></div>'+(sv?'<button class="pri sv" data-a="xbackup">'+SAVEI+'Save</button>':'')+'</div>')}
function transformFilters(){const sel=document.querySelector('#invcat,#availcat,#buycat');if(!sel)return;const card=sel.closest('.card');if(!card)return;const inp=card.querySelector('input[type=search]');if(!inp)return;
 const active=[...card.querySelectorAll('select')].filter(x=>x.value!=='All categories'&&x.value!=='all').length;const sw=inp.closest('.fld');
 const row=document.createElement('div');row.className='searchrow';const lab=document.createElement('label');lab.className='srch';lab.innerHTML="<svg viewBox='0 0 24 24'><circle cx='11' cy='11' r='7'/><path d='M20 20l-4-4'/></svg>";lab.appendChild(inp);row.appendChild(lab);
 const b=document.createElement('button');b.className='chip';b.dataset.a='xfilt';b.innerHTML='Filters'+(active?'<i>'+active+'</i>':'');row.appendChild(b);if(sw)sw.remove();
 const btns=[...card.querySelectorAll('button')];card.classList.add('filtbox');if(filtOpen)card.classList.add('open');card.parentNode.insertBefore(row,card);
 if(btns.length){const act=document.createElement('div');act.className='actrow';btns.forEach(x=>act.appendChild(x));card.parentNode.insertBefore(act,card)}}
function buildNav(){const nav=document.getElementById('nav');if(!nav)return;const main=['inv','buy','avail','med'],lab={inv:'Add Items',buy:'Shopping',avail:'Available',med:'Medicines'},names=Object.fromEntries(TABS),rest=TABS.map(t=>t[0]).filter(k=>!main.includes(k)),n=buyList().length;
 nav.innerHTML=main.map(k=>'<button class="nb'+(tab==k?' on':'')+'" data-t="'+k+'">'+NAVI[k]+'<span>'+lab[k]+'</span>'+(k=='buy'&&n?'<i class="bdg">'+n+'</i>':'')+'</button>').join('')+'<button class="nb'+(rest.includes(tab)?' on':'')+'" data-a="xmore">'+NAVI.more+'<span>More</span></button>';
 let sh=document.getElementById('sheet');if(!sh){sh=document.createElement('div');sh.id='sheet';document.body.appendChild(sh)}
 sh.className=moreOpen?'open':'';sh.innerHTML='<button class="backdrop" data-a="xmore" aria-label="Close"></button><div class="sheet"><h3>More</h3>'+rest.map(k=>'<button class="go'+(tab==k?' on':'')+'" data-t="'+k+'">'+names[k]+'</button>').join('')+'</div>'}
function tidyBars(){document.querySelectorAll('#app .bar').forEach(bar=>{[...bar.children].forEach(el=>{const n=el.nextElementSibling;if(el.tagName==='LABEL'&&!el.querySelector('input,select')&&n&&/^(SELECT|INPUT)$/.test(n.tagName)){const w=document.createElement('div');w.className='fld';bar.insertBefore(w,el);w.appendChild(el);w.appendChild(w.nextElementSibling)}})})}
(function(){const r0=render;render=function(){r0.apply(this,arguments);try{tidyBars();transformFilters();backupNote();pageHead();buildNav()}catch(_){}};render()})();
(function(){const sp=document.getElementById('splash');if(sp)setTimeout(()=>{sp.classList.add('hide');setTimeout(()=>sp.remove(),800)},8000)})();
</script>
</body>
